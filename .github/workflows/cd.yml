name: CD

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: cd-infra-db
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Garante bucket do state Terraform
        run: |
          BUCKET=tc-fiap-oficina-tfstate-512135631497
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          fi
      - run: terraform init -input=false
      # Etapa 1: instâncias RDS antes dos providers postgresql, que dependem
      # do endereço delas (necessário com state vazio, ex.: conta do lab
      # recriada). Sem mudanças quando as instâncias já existem.
      - name: Apply das instâncias RDS (etapa 1)
        run: terraform apply -auto-approve -input=false -target=aws_db_instance.main -target=aws_db_instance.execution
      - name: Apply completo (etapa 2)
        run: terraform apply -auto-approve -input=false
